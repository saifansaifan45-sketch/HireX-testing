[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    smoke: Quick essential smoke checks
    sanity: Module sanity checks
    functional: Functional user workflow tests
    api: REST API tests using Playwright APIRequestContext
    security: Security, session isolation, and RBAC tests
    performance: API and browser performance latency checks
    e2e: End-to-end multi-role recruitment lifecycle tests

